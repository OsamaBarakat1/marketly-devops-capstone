# TEMPLATE — no secret values, only the variable names. Rendered with
# envsubst at deploy time (see scripts/deploy.sh) and never applied as it
# stands.
#
# SHARED_SECRET must be byte-identical to the value in
# orders-service/secret.yaml and catalog-service/secret.yaml. auth-service
# signs access tokens with it; the other two verify those tokens locally
# rather than calling back here. If the values differ, tokens issued by this
# service fail verification everywhere else and every authenticated request
# returns 401 — while login itself keeps working, which is what makes the
# failure confusing to trace.
#
# Both services read the same variable from the same rendering pass, so they
# cannot drift.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: marketly
  labels:
    app: auth-service
    app.kubernetes.io/part-of: marketly
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  SHARED_SECRET: "${SHARED_SECRET}"

  # Without this, app.py falls back to its built-in default of "admin1234"
  # for a user whose role is "admin" — a password published in this
  # repository, on an application the load balancer exposes to the internet.
  # Generated on the first deploy and kept in SSM, like the signing key.
  #
  # The seed runs INSERT ... ON CONFLICT (username) DO NOTHING, so this sets
  # the password only when the admin row does not yet exist. Changing the SSM
  # parameter later will not rotate an admin account that has already been
  # created; delete the row, or change the password through the API.
  #
  # Read it back with:
  #   aws ssm get-parameter --name /<prefix>/app/admin-seed-password \
  #     --with-decryption --query Parameter.Value --output text
  ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD}"
