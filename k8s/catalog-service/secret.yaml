# TEMPLATE — contains no secret values, only the variable names that hold
# them. Rendered with envsubst at deploy time (see scripts/deploy.sh), never
# applied as it stands.
#
# The values come from AWS at deploy time: DATABASE_URL is assembled from the
# RDS endpoint plus the password RDS generated into Secrets Manager, and
# SHARED_SECRET is read from SSM. Neither has ever been typed by a person or
# written to disk in this repository.
#
# catalog-service needs SHARED_SECRET even though it issues no tokens: it
# verifies the admin JWT locally on every write endpoint, using the same
# secret auth-service signs with, so no callback to auth-service is needed.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-service-secrets
  namespace: marketly
  labels:
    app: catalog-service
    app.kubernetes.io/part-of: marketly
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  SHARED_SECRET: "${SHARED_SECRET}"
