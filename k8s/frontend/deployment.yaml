apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: marketly
  labels:
    app: frontend
    app.kubernetes.io/part-of: marketly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${ECR_REGISTRY}/${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80

          # The image's Nginx also knows how to proxy /api to the backend
          # Services, which is how it works under docker compose. In the
          # cluster the Ingress matches those paths first and they never
          # reach this pod — but the hostnames it would use are the same
          # Service names, so the fallback is correct rather than merely
          # unused.
          env:
            - name: AUTH_SERVICE_HOST
              value: auth-service
            - name: CATALOG_SERVICE_HOST
              value: catalog-service
            - name: ORDERS_SERVICE_HOST
              value: orders-service

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Nginx's master process starts as root and drops its workers
              # to an unprivileged user, which needs exactly these. Dropping
              # ALL without adding them back leaves the container unable to
              # start its workers.
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]

          # Static files only, so there is no database to wait for and it
          # serves almost immediately.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Serving pre-built static assets is cheap; this is the smallest
          # allocation of the four.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
