# Non-secret configuration. Anything here is readable by anyone with access
# to the namespace, so it holds addresses and flags only — never a
# credential. Credentials live in the per-service Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketly-config
  namespace: marketly
  labels:
    app.kubernetes.io/part-of: marketly
data:
  # Service discovery. orders-service resolves this name through cluster DNS
  # to catalog-service's ClusterIP, so the call never leaves the cluster and
  # never passes through the load balancer.
  CATALOG_SERVICE_URL: "http://catalog-service:5002"

  # The browser reaches the app on one origin through the Ingress, so this
  # is the ALB's address. Substituted at deploy time because the DNS name is
  # generated by AWS and is not known when this file is written.
  CORS_ALLOWED_ORIGIN: "${APP_ORIGIN}"

  # Stays false while the ALB listener is plain HTTP. A Secure cookie is
  # never sent over HTTP, so setting this true without TLS silently breaks
  # login: the refresh cookie would be set and then never returned.
  COOKIE_SECURE: "false"
