# TEMPLATE — no secret values, only the variable names. Rendered with
# envsubst at deploy time (see scripts/deploy.sh) and never applied as it
# stands.
#
# SHARED_SECRET must match auth-service/secret.yaml exactly. This service
# decodes the caller's access token locally on every request instead of
# asking auth-service who the caller is, which removes a network hop from
# the hot path but means the two services must agree on the signing key.
#
# If they disagree the symptom is specific: login succeeds, the catalog
# loads, and every request to /api/orders returns 401 — because only this
# service is rejecting the token.
apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secrets
  namespace: marketly
  labels:
    app: orders-service
    app.kubernetes.io/part-of: marketly
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  SHARED_SECRET: "${SHARED_SECRET}"
