name: Security

# The pre-commit hook in .githooks only protects clones that opted into it
# (git config core.hooksPath .githooks). This job is the backstop: it scans
# every commit that reaches GitHub, from any machine, hook or no hook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret removed in a later commit is still a
          # leak if it remains reachable in an earlier one.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks detect --source . --redact --verbose

  iac-scan:
    name: Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tfsec
        env:
          TFSEC_VERSION: 1.28.14
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec-linux-amd64" -o tfsec
          sudo install tfsec /usr/local/bin/tfsec
          tfsec --version

      # Catches misconfiguration that `terraform validate` cannot: a bucket
      # left public, an unencrypted volume, a security group open to the
      # world. Findings that are deliberate carry a `tfsec:ignore` comment
      # with the reason, so anything reported here is genuinely unreviewed.
      - name: Scan Terraform
        run: tfsec terraform --no-color

  terraform-validate:
    name: Terraform validate and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # -backend=false means no credentials and no remote state are needed,
      # so this runs on a pull request from anyone without granting AWS access.
      - name: Init without backend
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate
        run: terraform validate
        working-directory: terraform

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform
