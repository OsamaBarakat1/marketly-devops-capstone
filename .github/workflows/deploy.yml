name: Deploy

# Runs on the self-hosted runner registered on the k3s control-plane
# instance. That placement is the point: the runner is already inside the
# VPC and already authenticated to the cluster, so the Kubernetes API never
# has to be exposed publicly and no kubeconfig is stored as a GitHub secret.
#
# Gated on ENABLE_CD. Without it the job is skipped rather than queued
# forever waiting for a runner that does not exist yet.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (defaults to the current HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Two rollouts of the same Deployment at once leave it in a state neither
  # run intended.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out to k3s
    if: >-
      vars.ENABLE_CD == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      NAMESPACE: marketly
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'marketly-dev' }}
      PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX || 'marketly-dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # k3s writes its kubeconfig here. The bootstrap script sets mode 0644
      # so the runner's user can read it without sudo.
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    steps:
      - name: Resolve the commit to deploy
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ inputs.image_tag }}"
            [ -n "$sha" ] || sha="${{ github.sha }}"
          else
            # workflow_run checks out the default branch tip by default,
            # which may already be ahead of the commit CI built. Deploying
            # that would ship an image tag ECR does not have.
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      # scripts/deploy.sh is the single implementation of the deploy: it
      # discovers the registry, database and load balancer from AWS, reads
      # the signing key from SSM and the database password from Secrets
      # Manager, renders the manifests, applies them, and waits for all four
      # rollouts. Repeating any of that here would give it a second copy to
      # drift from, and would mean CI never exercised the script a developer
      # runs by hand.
      #
      # --skip-terraform because terraform.yml owns infrastructure; this job
      # only moves the cluster to a new image tag. Credentials come from the
      # instance role — there are none on disk.
      - name: Deploy
        run: scripts/deploy.sh --skip-terraform --tag "${{ steps.target.outputs.sha }}" --yes

      # The same four-layer check a developer runs when something breaks:
      # nodes, deployments, each backend's /health, and a request through
      # the load balancer. Rollout status alone only proves the pods
      # started, not that a request survives the whole path.
      - name: Health check
        run: scripts/healthcheck.sh --wait 120

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -30 || true
          for d in auth-service catalog-service orders-service frontend; do
            echo "--- $d ---"
            kubectl logs "deployment/$d" -n "$NAMESPACE" --tail=40 || true
          done
